<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабораторная работа №2</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#17202a;background:#f3f5f7;--ink:#17202a;--muted:#68727d;--line:#d9dee4;--panel:#fff;--accent:#0f766e;--accent-soft:#e7f5f3;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e8eeed 0,#f3f5f7 260px);min-height:100vh}.shell{max-width:1320px;margin:0 auto;padding:34px 24px 48px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding:30px 32px;background:#162b2a;color:#fff;border-radius:22px 22px 8px 8px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a7d8d3;font-weight:800}.hero h1{font-size:30px;line-height:1.15;margin:8px 0 9px;max-width:760px}.hero p{margin:0;color:#c7d6d4;max-width:780px;line-height:1.5}.formats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:300px}.formats span{border:1px solid #426361;background:#213c3a;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;letter-spacing:.04em}
.workspace{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:8px 8px 22px 22px;box-shadow:0 18px 45px #25313a12;overflow:hidden}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line)}input[type=file]{display:none}.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:750;cursor:pointer;background:var(--accent);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border-color:#cbd2d9}.btn:hover{filter:brightness(.97)}.hint{margin-left:auto;color:var(--muted);font-size:12px}
.dashboard{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.metric{padding:18px 22px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:750}.metric b{display:block;font-size:26px;margin-top:5px;font-variant-numeric:tabular-nums}.metric.danger b{color:var(--danger)}
.process{padding:17px 22px 18px;border-bottom:1px solid var(--line);background:#fafbfb}.process-top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:10px}.note{margin:0;color:#56616c;font-size:13px}.progress{height:7px;background:#e2e7e7;border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);transition:width .12s ease}
.table-head{display:flex;justify-content:space-between;align-items:center;padding:17px 22px 11px}.table-head h2{font-size:16px;margin:0}.table-head span{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto;margin:0 22px 22px;border:1px solid var(--line);border-radius:12px;max-height:58vh}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:11px 12px;border-bottom:1px solid #e8ebee;text-align:left;vertical-align:top;font-size:13px}th{position:sticky;top:0;background:#f0f3f3;color:#42505a;z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.05em}tbody tr:hover{background:#f8faf9}tr.bad{background:#fff6f5}.ok{display:inline-block;color:#087443;background:#eaf8f0;border-radius:999px;padding:3px 8px;font-weight:800}.bad-text{color:var(--danger);font-weight:800}.muted{color:#7a858f;font-size:12px}
@media(max-width:850px){.hero{grid-template-columns:1fr}.formats{justify-content:flex-start;max-width:none}.dashboard{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.hint{width:100%;margin-left:0}.shell{padding:14px}.hero{padding:24px}.hero h1{font-size:25px}}@media(max-width:520px){.dashboard{grid-template-columns:1fr}.metric{border-right:0!important;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.toolbar{align-items:stretch}.btn{justify-content:center;flex:1 1 100%}}
</style>
</head>
<body>
<div class="shell">
<header class="hero">
<div>
<h1>Анализ графических файлов</h1>
<p>Побайтовое чтение структуры изображений без библиотек метаданных</p>
</div>
<div class="formats" aria-label="Поддерживаемые форматы"><span>JPG</span><span>GIF</span><span>TIFF</span><span>BMP</span><span>PNG</span><span>PCX</span></div>
</header>
<main class="workspace">
<section class="toolbar" aria-label="Выбор данных">
<label class="btn">＋ Добавить файлы<input id="files" type="file" multiple accept=".jpg,.jpeg,.gif,.tif,.tiff,.bmp,.png,.pcx"></label>
<label class="btn secondary">▣ Открыть папку<input id="folder" type="file" multiple webkitdirectory></label>
<button id="clear" class="btn secondary" type="button">Очистить результаты</button>
<span class="hint"></span>
</section>
<section class="dashboard" aria-label="Статистика">
<div class="metric"><span class="metric-label">Найдено</span><b id="found">0</b></div>
<div class="metric"><span class="metric-label">Обработано</span><b id="done">0</b></div>
<div class="metric danger"><span class="metric-label">Ошибки</span><b id="broken">0</b></div>
<div class="metric"><span class="metric-label">Общий объём</span><b id="size">0 МБ</b></div>
</section>
<section class="process">
<div class="process-top"><p id="message" class="note">Выберите отдельные изображения или папку для анализа:</p></div>
<div class="progress" aria-label="Прогресс обработки"><div id="bar"></div></div>
</section>
<section>
<div class="table-head"><h2>Результаты анализа</h2></div>
<div class="table-wrap">
<table>
<thead><tr><th>Файл</th><th>Формат</th><th>Размер, px</th><th>Разрешение, dpi</th><th>Глубина</th><th>Сжатие</th><th>Состояние</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</section>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
